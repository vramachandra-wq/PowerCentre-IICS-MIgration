name: Build IICS Package

on:
  pull_request:
    paths:
      - "business/iics/**"
      - "input_xml/**"
      - "app.py"
      - "common/config/config.json"
      - ".github/workflows/iics-package.yml"
  push:
    branches:
      - main
      - "feature/**"

jobs:
  build-iics-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Parse PowerCenter XML
        run: python app.py --mode parse

      - name: Generate IICS package
        run: python app.py --mode iics-package

      - name: Validate generated package
        run: python app.py --mode iics-package --iics-zip output/iics_generated/iics_generated_package_checksum.zip

      - name: Upload IICS package artifact
        uses: actions/upload-artifact@v4
        with:
          name: iics-import-package
          path: |
            output/iics_generated/iics_generated_package_checksum.zip
            output/iics_generated/generation_summary.json
            output/iics/iics_import_package.zip
            output/iics/summary.json
